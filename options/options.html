<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>finally-good-blocker</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <svg class="line-drawing" viewBox="0 0 150 72" aria-hidden="true">
        <path d="M3 54H86V23L131 8" />
        <circle cx="3" cy="54" r="3" />
        <circle cx="131" cy="8" r="3" />
      </svg>

      <section class="mode-section" aria-label="blocking mode">
        <div id="mode-switch" class="mode-switch" data-mode="blocklist">
          <span class="mode-label mode-label-blocklist">blocklist</span>
          <button
            id="mode-toggle"
            class="mode-toggle"
            type="button"
            role="switch"
            aria-checked="false"
            aria-label="switch to allowlist mode"
          ></button>
          <span class="mode-label mode-label-allowlist">allowlist</span>
        </div>
        <p id="mode-status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="add-section" aria-labelledby="add-heading">
        <h2 id="add-heading">add a blocked site</h2>
        <form id="add-site-form" class="add-form">
          <label class="domain-field">
            <span class="visually-hidden">domain or URL</span>
            <input
              id="site-input"
              name="site"
              type="text"
              inputmode="url"
              autocomplete="off"
              required
            />
          </label>
          <button class="add-button" type="submit">add</button>
        </form>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="sites-section" aria-labelledby="sites-heading">
        <h2 id="sites-heading">blocked sites</h2>
        <div id="site-list">
          <p class="empty-state">No sites yet.</p>
        </div>
      </section>

    </main>

    <script src="../shared/domain.js"></script>
    <script src="../shared/scheme.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
