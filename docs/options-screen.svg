<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">finally-good-blocker settings</title>
  <desc id="description">A warm off-white settings page with a blocklist and allowlist mode switch, a minimal add-site field, and a compact table of blocked domains.</desc>

  <rect width="1200" height="700" fill="#fffdf8" />

  <g transform="translate(250 84)" fill="none" stroke="#2d2926" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
    <path d="M3 54H86V23L131 8" />
    <circle cx="3" cy="54" r="3" />
    <circle cx="131" cy="8" r="3" />
  </g>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#2d2926">
    <text x="250" y="194" font-size="14.5">blocklist</text>
    <line x1="322" y1="189" x2="350" y2="189" stroke="#d9d2c8" stroke-width="1" />
    <circle cx="326" cy="189" r="4" fill="#fffdf8" stroke="#2d2926" stroke-width="1" />
    <text x="362" y="194" font-size="14.5" fill="#746d65">allowlist</text>

    <text x="250" y="270" font-size="22" font-weight="650" letter-spacing="-0.4">add a blocked site</text>
    <text x="894" y="318" font-size="16" text-anchor="middle">add</text>
    <line x1="250" y1="332" x2="950" y2="332" stroke="#d9d2c8" stroke-width="1" />

    <text x="250" y="426" font-size="22" font-weight="650" letter-spacing="-0.4">blocked sites</text>
    <line x1="250" y1="443" x2="950" y2="443" stroke="#d9d2c8" stroke-width="1" />

    <g fill="#746d65" font-size="12.5" font-weight="500">
      <text x="282" y="474">site</text>
      <text x="575" y="474" text-anchor="middle">hold</text>
      <text x="680" y="474" text-anchor="middle">base</text>
      <text x="785" y="474" text-anchor="middle">extra</text>
    </g>
    <line x1="250" y1="490" x2="950" y2="490" stroke="#d9d2c8" stroke-width="1" />

    <g font-size="14.5" font-weight="400">
      <text x="282" y="524" fill="#746d65">mail.google.com</text>
      <text x="575" y="524" text-anchor="middle">10</text>
      <text x="680" y="524" text-anchor="middle">30</text>
      <text x="785" y="524" text-anchor="middle">5</text>
      <text x="894" y="524" text-anchor="middle" fill="#9c4238">remove</text>

      <text x="282" y="572" fill="#746d65">outlook.com</text>
      <text x="575" y="572" text-anchor="middle">10</text>
      <text x="680" y="572" text-anchor="middle">30</text>
      <text x="785" y="572" text-anchor="middle">5</text>
      <text x="894" y="572" text-anchor="middle" fill="#9c4238">remove</text>
    </g>

    <line x1="250" y1="540" x2="950" y2="540" stroke="#d9d2c8" stroke-width="1" />
    <line x1="250" y1="588" x2="950" y2="588" stroke="#d9d2c8" stroke-width="1" />
  </g>
</svg>
